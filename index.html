html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}

.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}

.g{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}

.mu{color:var(--mu);font-size:14px}.ex{color:var(--ex);font-weight:600}.ok{color:var(--ok);font-weight:600}
.seg{display:flex;gap:8px;margin:6px 0}.seg button{flex:1}
.hid{display:none}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}.top b{font-size:18px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}

.tile .ti{font-size:24px;line-height:1}.tile .bd{position:absolute;top:6px;right:8px;font-size:12px;color:var(--ok)}
.acts{display:flex;gap:10px;margin:12px 0}.acts button{flex:1}.ok2{background:var(--ok)}
.tot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.tot b{display:block;font-size:20px}

.av{width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-bottom:12px}

  r=await tmo(IDT+'/v1/accounts:signUp?key='+FBC.apiKey,{method:'POST',headers:{'Content-Type':'application/json'},body:'{"returnSecureToken":true}'});
  if(!r.ok)throw new Error('accesso '+r.status);

async function fs(method,path,body,qs,retry){const t=await tok();

async function pull(p){const tid=p.team.id,since=Math.max(0,(p.team.since||0)-60000);
  const r=await fs('POST','teams/'+tid+':runQuery',{structuredQuery:{from:[{collectionId:'days'}],where:{fieldFilter:{field:{fieldPath:'t'},op:'GREATER_THAN',value:{integerValue:String(since)}}},orderBy:[{field:{fieldPath:'t'},direction:'ASCENDING'}]}});
  const docs=(Array.isArray(r)?r:[]).filter(x=>x&&x.document).map(x=>x.document);
  let ch=false,maxT=p.team.since||0;
  for(const dc of docs){const f=dc.fields||{},id=dc.name.split('/').pop(),t=+((f.t&&f.t.integerValue)||0),del=!!(f.del&&f.del.booleanValue);
    if(t>maxT)maxT=t;
    const i=p.days.findIndex(x=>x.id===id),loc=i>=0?p.days[i]:null;
    if(!loc&&(p.tomb||[]).some(z=>z.id===id))continue;

    let o;try{o=JSON.parse(f.j.stringValue)}catch(e){continue}
    const nd=Object.assign(o,{id,t,by:(f.by&&f.by.stringValue)||'',sy:true});

  h+=`<h3>${L('Restore from code')}</h3><input id="bkc" placeholder="xxxx-xxxx-xxxx-xxxx" autocapitalize="off" autocomplete="off"><button class="s" style="width:100%" onclick="bkRestore()">${L('Restore')}</button>`;
  h+=`<h3>${L('Backup file')}</h3><button class="s" style="width:100%" onclick="bkSave()">${L('Export file')}</button><button class="s" style="width:100%" onclick="document.getElementById('bkf').click()">${L('Import file')}</button><input id="bkf" type="file" accept=".json,application/json" style="display:none" onchange="bkFile(this)">`;
  if(pendImp)h=`<h3>${L('Confirm restore')}</h3><p style="margin:0 0 6px">${L('Found <b>{0}</b> projects{1}. Current data on this device ({2} projects) will be <b>replaced</b>.',pendImp.o.projects.length,pendImp.t?L(' (backup of {0})',tf(pendImp.t)):'',S.projects.length)}</p><button style="width:100%;background:var(--ok)" onclick="bkApply()">${L('Replace and restore')}</button><button class="s" style="width:100%" onclick="pendImp=null;drawer()">${L('Cancel')}</button>`;
  return h}
setInterval(()=>{if(S.bk&&S.bk.on&&S.bk.dirty&&!document.hidden)bkPush()},60000);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.bk&&S.bk.on&&S.bk.dirty)bkPush()});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
let menuOpen=false,regEdit=false;
function menu(v){menuOpen=v;drawer()}
function drawer(){const d=$('#drawer');if(!d)return;
  if(!d.firstChild)d.innerHTML='<div class="bk" onclick="menu(false)"></div><aside class="dr"><div id="dc"></div></aside>';
  const p=S.profile,o=menuOpen&&!!p;
  d.querySelector('.bk').classList.toggle('on',o);d.querySelector('.dr').classList.toggle('on',o);
  d.querySelector('#dc').innerHTML=p?`<div class="av">${esc(((p.first[0]||'')+(p.last[0]||'')).toUpperCase())}</div><h2>${esc(p.first)} ${esc(p.last)}</h2><p class="mu" style="margin:4px 0 16px">${esc(p.role)}</p><button class="s" style="width:100%" onclick="menu(false);regEdit=true;render()">${L('Edit profile')}</button><div style="margin-top:16px">${langSel()}</div>${bkCard()}<p class="mu" style="margin:20px 0 0;text-align:center">Ore Lavoro · ${L('Version')} ${APP_VERSION}</p>`:'';
}
function regScreen(){const p=S.profile||{},ed=!!S.profile;
  $('#app').innerHTML=`<h1>${ed?L('Edit profile'):L('Welcome')}</h1>${ed?'':'<p class="mu">'+L('Enter your details once: they will be used in every project and in the PDF.')+'</p>'}<div class="card">${langSel()}</div>
  <div class="card"><div class="g"><div style="grid-column:span 2"><label>${L('First name')}</label><input id="r1" value="${esc(p.first||'')}" autocomplete="given-name"></div>
  <div style="grid-column:span 2"><label>${L('Last name')}</label><input id="r2" value="${esc(p.last||'')}" autocomplete="family-name"></div>
  <div style="grid-column:span 2"><label>${L('Role')}</label><input id="r3" value="${esc(p.role||'')}" placeholder="${L('e.g. DIT')}"></div></div>
  <button onclick="saveReg()" style="width:100%">${ed?L('Save'):L('Continue')}</button>${ed?'<button class="s" onclick="regEdit=false;render()" style="width:100%;margin-top:8px">'+L('Cancel')+'</button>':''}</div>`}
function saveReg(){const f=$('#r1').value.trim(),l=$('#r2').value.trim(),r=$('#r3').value.trim();
  if(!f||!l||!r){toast(L('Fill in first name, last name and role.'));return}
  S.profile={first:f,last:l,role:r};save();regEdit=false;render();if(S.pendJoin){const j=S.pendJoin;delete S.pendJoin;save();join(j)}}
function render(){if(!S.profile||regEdit)regScreen();else render0();drawer()}
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
render();startSync();if(S.bk&&S.bk.on&&S.bk.dirty)bkPush();
</script>
</body>
</html>
